<svg width="600" height="120" viewBox="0 0 600 120" xmlns="http://www.w3.org/2000/svg">

  <rect width="600" height="120" fill="#0D1117"/>

  <!-- Title -->
  <text x="0" y="20"
        font-family="Arial, sans-serif"
        font-size="16"
        font-weight="600"
        fill="#FFFFFF">
    Languages
  </text>

  <!-- Language bar -->
  <rect x="0" y="35" width="570" height="9" rx="4.5" fill="#30363D"/>

  <!-- Java 34% -->
  <rect x="0" y="35" width="194" height="9" fill="#F89820"/>

  <!-- C++ 25% -->
  <rect x="194" y="35" width="143" height="9" fill="#00599C"/>

  <!-- C 12% -->
  <rect x="337" y="35" width="68" height="9" fill="#A8B9CC"/>

  <!-- HTML 8% -->
  <rect x="405" y="35" width="46" height="9" fill="#E34F26"/>

  <!-- NASL 5% -->
  <rect x="451" y="35" width="29" height="9" fill="#4CAF50"/>

  <!-- Kotlin 4% -->
  <rect x="480" y="35" width="23" height="9" fill="#7F52FF"/>


  <!-- Java -->
  <circle cx="5" cy="67" r="4" fill="#F89820"/>
  <text x="15" y="71"
        font-family="Arial, sans-serif"
        font-size="12"
        fill="#C9D1D9">
    Java 34%
  </text>

  <!-- C++ -->
  <circle cx="115" cy="67" r="4" fill="#00599C"/>
  <text x="125" y="71"
        font-family="Arial, sans-serif"
        font-size="12"
        fill="#C9D1D9">
    C++ 25%
  </text>

  <!-- C -->
  <circle cx="225" cy="67" r="4" fill="#A8B9CC"/>
  <text x="235" y="71"
        font-family="Arial, sans-serif"
        font-size="12"
        fill="#C9D1D9">
    C 12%
  </text>


  <!-- HTML -->
  <circle cx="5" cy="92" r="4" fill="#E34F26"/>
  <text x="15" y="96"
        font-family="Arial, sans-serif"
        font-size="12"
        fill="#C9D1D9">
    HTML 8%
  </text>

  <!-- NASL -->
  <circle cx="115" cy="92" r="4" fill="#4CAF50"/>
  <text x="125" y="96"
        font-family="Arial, sans-serif"
        font-size="12"
        fill="#C9D1D9">
    NASL 5%
  </text>

  <!-- Kotlin -->
  <circle cx="225" cy="92" r="4" fill="#7F52FF"/>
  <text x="235" y="96"
        font-family="Arial, sans-serif"
        font-size="12"
        fill="#C9D1D9">
    Kotlin 4%
  </text>

</svg>
